<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electromedicina</title>
<style>
:root{--navy:#153b60;--red:#a71919;--green:#13733f;--line:#d8dee6;--muted:#667085;--bg:#f4f7fa}
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;font-family:"Segoe UI",Arial,sans-serif;color:#1f2937}.wrap{max-width:1150px;margin:auto;padding:20px 14px 44px}
header{background:#153b60;color:#fff;border-radius:16px;padding:22px}input{width:100%;padding:13px;border:1px solid #cbd5df;border-radius:10px;margin:16px 0;font-size:16px}
.card{background:#fff;border:1px solid #d8dee6;border-radius:14px;padding:16px;margin:10px 0}.serial{font-size:22px;color:#a71919;font-weight:900}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:10px}.lab{font-size:11px;color:#667085;font-weight:800}.val{font-weight:700}.ualsan{color:red;background:#ffeb3b;font-weight:900;padding:2px 5px}.btn{display:inline-block;margin-top:12px;background:#153b60;color:#fff;padding:9px 12px;border-radius:8px;text-decoration:none;font-weight:700}
</style></head><body><div class="wrap">
<header><h1>Electromedicina</h1><div>Inventario digital de material</div></header>
<input id="q" placeholder="Buscar por artículo, NOC, nº serie, observaciones o asignación">
<div id="cards"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const u=s=>/UALSAN/i.test(String(s||''))?'<span class="ualsan">'+esc(s)+'</span>':esc(s);
let data=[];
function draw(){
 const q=document.getElementById('q').value.toLowerCase().trim();
 const r=data.filter(x=>!q||[x.nombre_articulo,x.numero_serie,x.noc,x.observaciones,x.asignado_a,x.estado].join(' ').toLowerCase().includes(q));
 document.getElementById('cards').innerHTML=r.map(x=>`<article class="card">
   <h2>${esc(x.nombre_articulo)}</h2><div class="serial">L/S: ${esc(x.numero_serie)}</div>
   <div class="meta">
    <div><div class="lab">NOC</div><div class="val">${esc(x.noc)||'—'}</div></div>
    <div><div class="lab">ASIGNADO A</div><div class="val">${u(x.asignado_a)||'—'}</div></div>
    <div><div class="lab">ESTADO</div><div class="val">${esc(x.estado)||'—'}</div></div>
    <div><div class="lab">FCH CAD CTL</div><div class="val">${esc(x.fch_cad_ctl)||'—'}</div></div>
    <div><div class="lab">OBSERVACIONES</div><div class="val">${esc(x.observaciones)||'—'}</div></div>
   </div><a class="btn" href="${esc(x.filename)}">VER FICHA</a>
 </article>`).join('');
}
fetch('data/inventario.json').then(r=>r.json()).then(d=>{data=d;draw()}).catch(()=>document.getElementById('cards').innerHTML='<div class="card">No se pudo cargar data/inventario.json</div>');
document.getElementById('q').addEventListener('input',draw);
</script></div></body></html>
